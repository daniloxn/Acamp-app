[package]
name = "acamp"
version = "0.1.0"
description = "ACAMP study assistant"
authors = ["ACAMP"]
edition = "2021"

[lib]
name = "acamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
